name: Mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Daily, against the tip of thumbfree-mac's main rather than the commit Package.swift pins (the canary step below),
  # so a change there that breaks this app is caught before the next pin.
  schedule:
    - cron: '30 5 * * *'

concurrency:
  group: mac-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.swift') }}-${{ github.run_id }}
          restore-keys: spm-${{ runner.os }}-

      # The scheduled run only: Package.swift's pinned thumbfree-mac becomes `branch: "main"` here, in this run's copy,
      # so the build and the tests below run against the tip of its main. Pull requests and pushes keep the pin.
      - name: thumbfree-mac at the tip of main (daily canary)
        if: github.event_name == 'schedule'
        run: |
          pinned='(\.package\(url: "https://github\.com/shivam098/thumbfree-mac\.git", )revision: "[0-9a-f]{40}"\)'
          moved='.package(url: "https://github.com/shivam098/thumbfree-mac.git", branch: "main")'
          sed -E "s#$pinned#\\1branch: \"main\")#" Package.swift > Package.swift.canary
          mv Package.swift.canary Package.swift
          if ! grep -qF "$moved" Package.swift; then
            echo "::error::Package.swift has no pinned thumbfree-mac revision that this step can move to main" >&2
            exit 1
          fi
          git diff Package.swift

      - name: Resolve (thumbfree-mac at ${{ github.event_name == 'schedule' && 'main' || 'the pinned commit' }})
        run: |
          swift package update
          cat Package.resolved

      - name: Build
        run: swift build -c release

      # UIRenderTests draws the pill, the menu, the reminder cards and the window into UI_RENDER_DIR; the folder is
      # kept as the run's ui-renders artifact, to look at.
      - name: Tests
        id: tests
        env:
          UI_RENDER_DIR: ${{ runner.temp }}/ui-renders
        run: swift test

      - name: Keep the UI renders
        if: ${{ !cancelled() && (steps.tests.outcome == 'success' || steps.tests.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-renders
          path: ${{ runner.temp }}/ui-renders
          if-no-files-found: error

      # The AI brain's integration test (tests/VoiceAssistantMacTests/BrainIntegrationTests.swift): the pinned llama.cpp
      # build and a 1 MB model, kept between runs, on this runner's graphics chip.
      - uses: actions/cache@v4
        with:
          path: ~/brain-integration
          key: brain-integration-llama-b12483-stories260K-1

      - name: AI brain integration test (llama-server, Metal, the supervisor)
        timeout-minutes: 10
        env:
          # The server's log, printed by the test, then says which graphics chip it uses.
          LLAMA_ARG_LOG_VERBOSITY: '4'
        run: BRAIN_INTEGRATION_FOLDER="$HOME/brain-integration" swift test --filter BrainIntegrationTests

      # The navigation integration tests drive Chrome, Edge and Safari. The runner image installs Chrome and Edge with
      # Homebrew, which quarantines them, and Launch Services asks before it first opens a quarantined app, which no one
      # answers here. Safari's tabs come from AppleScript, which needs the Automation permission: the image gives its
      # agent (whose processes the tests are) that permission for Finder and System Events only.
      - name: Prepare the apps the navigation tests drive
        run: |
          for app in "/Applications/Google Chrome.app" "/Applications/Microsoft Edge.app"; do
            if xattr -p com.apple.quarantine "$app" >/dev/null 2>&1; then
              sudo xattr -dr com.apple.quarantine "$app" && echo "$app: no longer quarantined"
            else
              echo "$app: not quarantined"
            fi
          done

          db="$HOME/Library/Application Support/com.apple.TCC/TCC.db"
          now=$(date +%s)
          for client in /opt/hca/hosted-compute-agent /bin/bash; do
            row="'kTCCServiceAppleEvents','$client',1,2,3,1,NULL,NULL,0,'com.apple.Safari',NULL,NULL,$now,NULL,NULL,'UNUSED',$now"
            if sqlite3 "$db" "INSERT OR REPLACE INTO access VALUES($row);"; then
              echo "Automation of Safari allowed for $client"
            else
              echo "TCC.db refused the row for $client"
            fi
          done

      # The navigation integration tests (tests/VoiceAssistantMacTests/NavigationIntegrationTests.swift): the
      # NavigationLab pages in Chrome, Edge and Safari, and Finder, TextEdit and System Settings, through the real
      # Accessibility API, CGEvent and AppleScript. A step of their own with a time limit, as they drive other apps.
      - name: Navigation integration tests (browsers, Finder, TextEdit, System Settings)
        timeout-minutes: 12
        env:
          VOICE_ASSISTANT_NAVIGATION_TESTS: '1'
        run: swift test --filter NavigationIntegrationTests
