name: App

# Voice Assistant.app, universal and signed ad hoc, in a .dmg to test on a Mac (scripts/make-app.sh). The .dmg is this
# run's artifact. The Release workflow (release.yml) builds a release's .dmg with it too.
on:
  push:
    branches: [main]
    paths:
      - "Sources/**"
      - "scripts/**"
      - "assets/**"
      - "Package.swift"
      - ".github/workflows/app.yml"
  pull_request:
    paths:
      - "Sources/**"
      - "scripts/**"
      - "assets/**"
      - "Package.swift"
      - ".github/workflows/app.yml"
  workflow_dispatch:
  # The Release workflow (release.yml) builds with it, at the version it releases.
  workflow_call:
    inputs:
      version:
        description: The version, such as 0.1.0 (empty for scripts/make-app.sh's, the latest v* tag's, else 0.1.0)
        type: string
        default: ""

# When the Release workflow calls it, github.workflow is "Release", so a release's build and the App runs of the same
# branch never cancel each other.
concurrency:
  group: app-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  app:
    name: Voice Assistant.app in a .dmg (signed ad hoc)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # The whole history, so the script finds the latest v* tag for the version.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tools
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      # thumbfree-mac as Package.swift says: its main, as the Mac workflow builds it, until a release pins a commit.
      - name: Build the app and the disk image
        env:
          VERSION: ${{ inputs.version }}
        run: ./scripts/make-app.sh "$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: VoiceAssistant-dmg
          path: dist/VoiceAssistant-*.dmg
          if-no-files-found: error
